<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>naija-phone-input</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main>
  <h1>naija-phone-input</h1>
  <p class="tagline">A phone field that respects how people actually type numbers.</p>

  <div class="field">
    <label for="phone">Phone number</label>
    <input id="phone" type="tel" inputmode="tel" autocomplete="tel"
           placeholder="e.g. 0803 123 4567" aria-describedby="phone-msg" />
    <p id="phone-msg" aria-live="polite"></p>
  </div>

  <div class="field">
    <span class="label">Normalized (what your backend receives)</span>
    <code id="normalized">—</code>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
